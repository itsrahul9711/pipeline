trigger:
- main
- feature\*

pool: infra_dondu

stages:
  - stage: tfsec
    displayName: tfsec scan
    jobs:
      - job: tfsec
        displayName: tfsec scan
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tfsec'

  - stage: tflint
    displayName: tflint scan
    jobs:
      - job: tflint
        displayName: tflint scan
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tflint --recursive --force'

  - stage: infracost
    displayName: infracost
    jobs:
      - job: infracost 
        displayName: infracost
        steps:
          - task: InfracostSetup@2
            inputs:
              apiKey: 'ico-sqro8FlLxZss9ygbGP6Egl2USz9q8Y6Q'
              version: '0.10.x'
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'infracost breakdown --path.'

  - stage: init
    displayName: init
    jobs:
      - job: init
        displayName: init
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendAzureRmUseEntraIdForAuthentication: false
              backendServiceArm: 'Dondu_Service_Connection'
              backendAzureRmStorageAccountName: 'dondu'
              backendAzureRmContainerName: 'dondustorage'
              backendAzureRmKey: 'lab.tfstate'

  - stage: validate
    displayName: validate
    jobs:
      - job: validate
        displayName: validate
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendAzureRmUseEntraIdForAuthentication: false
              backendServiceArm: 'Dondu_Service_Connection'
              backendAzureRmStorageAccountName: 'dondu'
              backendAzureRmContainerName: 'dondustorage'
              backendAzureRmKey: 'lab.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'

  - stage: plan
    displayName: plan
    jobs:
      - job: plan
        displayName: plan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendAzureRmUseEntraIdForAuthentication: false
              backendServiceArm: 'Dondu_Service_Connection'
              backendAzureRmStorageAccountName: 'dondu'
              backendAzureRmContainerName: 'dondustorage'
              backendAzureRmKey: 'lab.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'Dondu_Service_Connection'

  - stage: approval
    displayName: approval
    jobs:
      - job: approval
        displayName: approval
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'abc'
          
  - stage: apply
    displayName: apply
    jobs:
      - job: apply
        displayName: apply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendAzureRmUseEntraIdForAuthentication: false
              backendServiceArm: 'Dondu_Service_Connection'
              backendAzureRmStorageAccountName: 'dondu'
              backendAzureRmContainerName: 'dondustorage'
              backendAzureRmKey: 'lab.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'Dondu_Service_Connection'
          